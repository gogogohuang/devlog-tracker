name: hook-self-checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck hook scripts
        run: |
          # -S warning: skip info/style noise (SC2015 assert idioms, SC2181, etc.)
          shellcheck --external-sources --source-path=SCRIPTDIR -S warning \
            hooks/scripts/*.sh hooks/scripts/tests/*.sh cursor/hooks/*.sh codex/hooks/*.sh
      - name: Run hook self-checks
        run: bash hooks/scripts/run-tests.sh
      - name: Run CLI unit tests
        run: node --test cli/*.test.js
